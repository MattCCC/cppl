# Machine-readable manifest for the case-analysis feature.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature case-analysis

feature: case-analysis

summary: >
  Proof-side case analysis and product decomposition over ordinary C++ values:
  `cases` splits a goal over the complete state partition of a scoped
  enumeration, `std::variant`, `std::optional`, `std::expected` or a pointer, and
  `decompose` exposes the components of a record, `std::pair`, `std::tuple`,
  `std::array` or built-in array. One representation-independent engine owns
  arms, binders, exhaustiveness, residual cases and evidence; providers only
  state which states exist, the condition that holds in each, and which case a
  Clang-resolved label denotes. Nesting composes across providers with no code
  specific to any pair of them, and everything erases.

normative_sources:
  spec:
    - "§20 Proof-side case analysis and decomposition"
  grammar:
    - "§5.7 cases and product decomposition"
    - "§5.9 Proof arms"
    - "§18 Decomposition labels"
  foundations:
    - "§6.4 Abstract nominal sorts"
    - "§44 Abstract nominal values"
    - "§76 Structural case analysis"
    - "§77 Derived case evidence"
    - "§83 Product decomposition"
    - "§135 Case-analysis soundness schema"
  trust:
    - "§19 Case analysis, decomposition and representation models"
    - "§19.1 Standard representation obligations"

rule_families:
  - CASE

# The rules this feature realizes. CASE-011 to CASE-016 belong to
# checked-contradiction, which depends on this feature.
