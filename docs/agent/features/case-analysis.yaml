required_test_categories:
  - every provider's complete partition, residual case included
  - a missing, duplicated, out-of-range or wildcard arm
  - a newly added enumerator, alternative or field breaking an exhaustive proof
  - binder arity and binder type, each as a matched pair
  - every cross-provider nesting the plan lists, in both directions
  - aliases, alias templates, dependent forms and class template members
  - const, reference, member and element subjects
  - an unsigned enumerator with its top bit set
  - a specialization reached only through a reference
  - a product refused as a sum and a sum refused as a product
  - private, protected, base, union, reference and incomplete components
  - a type spelled like a standard one that is not it
  - forged branch facts and escaping or shadowing binders
  - kernel-evidence corruption of projections and partitions
  - erasure for every provider in every standard mode
  - a split on a runtime path whose contract holds only case by case, as a matched pair
  - a fact after a write, an aliased write, a call, a member or symbolic element write and a loop head
  - each arm supposing its own case and no other, and a split missing a state refused on the walk
  - arm contents on a path, a split outside a verified body, and the word used as a C++ name

completion_requires:
  - one engine; providers state states, conditions and label meaning only
  - the residual discriminator is derived by the engine, never supplied
  - no wildcard and no implicit catch-all
  - a binder is a projection or alias, never a new object
  - recognition by resolved identity, never by spelling
  - no provider-specific kernel rule
  - the construct erases completely, a split on a path to an empty statement
  - a split reads its subject through the one storage read, and has no invalidation of its own
  - every state of a split on a path has exactly one arm, checked where the path is walked
