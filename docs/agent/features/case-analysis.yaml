  spec:
    - "§3 Contextual C++L words (WORD-012)"
    - "§20 Proof-side case analysis and decomposition"
    - "§20.7 Case splits on a runtime path"
    - "§36 Erasure (ERASE-016)"
  grammar:
    - "§5.7 cases and product decomposition"
    - "§5.9 Proof arms"
    - "§18 Decomposition labels"
  foundations:
