interactions:
  - every pair of providers, nested in both directions
  - quantified goals and laws discharged through a case split
  - aliases, alias templates, dependent names and class template members
  - cv-qualified and reference subjects, members and array elements
  - omitted cases (checked-contradiction)
  - erasure

tests:
  positive:
    - tests/fixtures/enum_cases.cpp
    - tests/fixtures/structural_cases.cpp
    - tests/fixtures/expected_cases.cpp
  negative:
    - tests/negative/proof_cases.sh
    - tests/negative/structural_cases.sh
    - tests/negative/case_providers.sh
    - tests/fixtures/negative/enum_top_bit_claimed_false.cpp
    - tests/fixtures/negative/enum_label_of_another_instantiation.cpp
    - tests/fixtures/negative/decompose_undefined_template.cpp
    - tests/fixtures/negative/nested_binder_wrong_type.cpp
    - tests/fixtures/negative/nested_tuple_wrong_arity.cpp
    - tests/fixtures/negative/nested_pointer_arm_missing.cpp
    - tests/fixtures/negative/nested_valueless_missing.cpp
    - tests/fixtures/negative/nested_sum_decomposed_as_product.cpp
    - tests/fixtures/negative/cases_on_product.cpp
    - tests/fixtures/negative/protected_member.cpp
    - tests/fixtures/negative/expected_error_bound_as_value.cpp
  kernel:
    - tests/kernel/value_model_test.cpp
    - tests/kernel/adversarial_kernel_test.cpp
  unit:
    - tests/unit/decomposition_test.cpp
    - tests/unit/scoped_enum_provider_test.cpp
    - tests/unit/recognizer_test.cpp
    - tests/unit/projection_test.cpp
    - tests/unit/formatter_test.cpp
    - tests/unit/lsp_decomposition_view_test.cpp
  end_to_end:
    - tests/e2e/enum_cases.sh
    - tests/e2e/structural_cases.sh
    - tests/e2e/erasure_equivalence.sh

required_test_categories:
  - every provider's complete partition, residual case included
  - a missing, duplicated, out-of-range or wildcard arm
  - a newly added enumerator, alternative or field breaking an exhaustive proof
  - binder arity and binder type, each as a matched pair
  - every cross-provider nesting the plan lists, in both directions
  - aliases, alias templates, dependent forms and class template members
  - const, reference, member and element subjects
  - an unsigned enumerator with its top bit set
  - a specialization reached only through a reference
  - a product refused as a sum and a sum refused as a product
  - private, protected, base, union, reference and incomplete components
  - a type spelled like a standard one that is not it
  - forged branch facts and escaping or shadowing binders
  - kernel-evidence corruption of projections and partitions
  - erasure for every provider in every standard mode

completion_requires:
  - one engine; providers state states, conditions and label meaning only
  - the residual discriminator is derived by the engine, never supplied
  - no wildcard and no implicit catch-all
  - a binder is a projection or alias, never a new object
  - recognition by resolved identity, never by spelling
  - no provider-specific kernel rule
  - the construct erases completely
