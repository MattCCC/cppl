# Machine-readable manifest for the checked-contradiction feature.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature checked-contradiction

feature: checked-contradiction

summary: >
  One checked-contradiction mechanism for every claim that a context cannot
  occur: the `contradiction evidence;` proof statement, a case omitted from
  `cases` as `omit label by contradiction evidence;`, and the same statement in a
  verified body claiming a runtime path cannot occur. The named evidence and the
  premises standing where it is written, an omitted case's own discriminator
  included, are refuted into `False` before the goal is considered, by ordinary
  kernel-checked linear arithmetic, and the goal is then closed from `False` by
  falsity elimination, whatever its shape. An omission and a runtime claim are
  each an obligation of their own, under distinct origins; a claim ends its path
  and erases to an empty statement.

