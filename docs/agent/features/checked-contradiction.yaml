required_test_categories:
  - matched pair differing only in the omitted case
  - omission under a provable goal
  - omission under a satisfiable premise
  - absent arm with the discharging evidence in scope
  - arm and omission for one case
  - residual case omitted by its discriminator
  - omission under a quantifier the cases statement introduces
  - corrupted omission evidence
  - a goal equating structured values, closed and refused as a matched pair
  - falsity elimination over evidence that does not establish False
  - one contradiction under two origins
  - a runtime claim across branches, loops, verified calls and local versions
  - matched pair differing only in the condition that reaches a claim
  - a reachable claim under a provable goal
  - a claim whose evidence is unknown, refused, mistyped, over-instantiated or not an equality
  - a claim resting on an unproven callee
  - a claim outside a verified function
  - the claim's spelling kept as C++ where the word names a type
  - the same where only an included header names it, in the compiler and the editor
  - an impossibility never established by a strategy
  - contextual words as ordinary identifiers
  - erasure, including a claim as the body of an unbraced if

completion_requires:
  - an omission is justified only by a contradiction among the premises, never by its goal
  - the omitted case's own discriminator reaches the check
  - a missing arm is never read as an intentional omission
  - every certificate is checked by the kernel; an absent one is an unproven claim
  - an omission is an obligation of its own, with its own origin and identity
  - omitted cases and impossible paths never share an origin, identity or report line
  - a claim is checked against every fact of its path, ends it, and rests on a callee only once it is proven
  - the words stay contextual and ordinary C++ using them is unaffected
  - the construct erases completely, a claim to an empty statement
