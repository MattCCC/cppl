  spec:
    - "§3 Contextual C++L words"
    - "§12.7 Path-sensitive control flow"
    - "§20.2 Exhaustiveness and impossible cases"
    - "§20.6 Evidence and erasure"
    - "§36 Erasure"
  grammar:
    - "§1 Lexical rule"
    - "§5.6 contradiction"
    - "§5.7 cases and product decomposition"
    - "§49 Canonical formatting"
  foundations:
