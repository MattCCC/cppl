# Machine-readable manifest for the runtime-validation feature.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature runtime-validation

feature: runtime-validation

summary: >
  An unknown runtime value enters a refined type through ordinary C++: a
  condition the program evaluates and a crossing on the path where it held.
  The crossing owes its predicate under its whole path like any other, so a
  crossing on the failure path, before the check, of another value, or after
  a write, call or unsafe block that replaced the checked version is refused.
  Each crossing a runtime condition selects is also stated without its path's
  runtime conditions; only where the kernel accepts evidence for that is it
  established statically, and every other is a runtime validation site,
  reported RUNTIME-CHECKED with its location, refinement, predicate and
  function. Every claim resting on a site, in its own body, through verified
  calls or through an imported contract, names it and stays PROVEN; a site is
  not a trusted assumption. A verification interface records sites as a
  category of their own, part of the record's result identity. The check is
  ordinary code and erasure keeps it.

normative_sources:
  spec:
    - "§28 Runtime validation"
    - "§28.5 Runtime validation sites"
    - "§36.5 Runtime validation is not erased"
    - "§57 Verification and runtime checking are orthogonal"
    - "Annex V.15 runtime validation + refinement"
    - "Annex V.16 runtime validation + trusted"
    - "Annex Z.78 runtime validation failure"
  trust:
    - "§26.3 Runtime validation"
    - "§31.1 Verification interfaces as implemented"
    - "§36 Assurance statuses and reporting integrity"
  rfc:
    - "docs/rfcs/0021-runtime-checked-refinement-construction.md"

