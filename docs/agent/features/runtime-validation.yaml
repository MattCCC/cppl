required_test_categories:
  - every crossing form proven from path facts, with no site, and the program run on valid and invalid input
  - the failure path constructs nothing, in every crossing form
  - a check or validation made too late, too weak, of another value, or made stale
  - short-circuit routes and loop exits
  - a checked helper returning bool establishes a path fact
  - every validation position a verified body allows, and every one it refuses
  - sites listed whole; claims resting on them, directly and through calls
  - a site is never shown PROVEN and never counted as an assumption
  - erasure keeps every check and lowers every validation to its validator; identical code against the hand erasure
  - sites cross units in their own interface category and result identity

completion_requires:
  - only a validation expression is a runtime validation site
  - an unproven crossing is refused, never made a site
  - every claim resting on a site names it, across units too
  - a site adds no trusted assumption
  - every check survives erasure unchanged, and every validation calls its validator
