depends_on:
  - refinement-types
  - verified-sequences
  - trust-propagation
  - cross-tu-contracts
  - erasure

implementation:
  obligations:
    - compiler/obligations/include/cppl/obligations/contracts.hpp
    - compiler/obligations/src/contracts.cpp
    - compiler/obligations/include/cppl/obligations/trust.hpp
    - compiler/obligations/src/trust.cpp
    - compiler/obligations/src/interface.cpp
    - compiler/obligations/src/generate.cpp
  automation:
    - compiler/automation/include/cppl/automation/evidence.hpp
    - compiler/automation/src/evidence.cpp
  artifact:
    - compiler/artifact/include/cppl/artifact/interface.hpp
    - compiler/artifact/src/interface.cpp
  driver:
    - compiler/driver/src/pipeline.cpp
    - compiler/driver/src/driver.cpp
    - compiler/driver/include/cppl/driver/semantics.hpp

interactions:
  - refined locals, members, array elements and vector content invariants
  - refined results and refined parameters of verified callees
  - call post-states entering refined storage
  - conditional initializers and short-circuit conditions
  - loop conditions and loop invariants
  - preconditions, which establish a crossing statically
  - writes, verified calls and unsafe blocks between check and crossing
  - verified-call composition and recursion groups
  - verification interfaces across units
  - erasure

tests:
  positive:
    - tests/fixtures/runtime_validation.cpp
    - tests/fixtures/runtime_validation.reference.cpp
    - tests/fixtures/runtime_validation_cross_tu/validate.cpp
    - tests/fixtures/runtime_validation_cross_tu/consume.cpp
    - tests/fixtures/runtime_validation_cross_tu/relay.cpp
  negative:
    - tests/negative/runtime_validation.sh
    - tests/fixtures/negative/runtime_check_failure_path.cpp
    - tests/fixtures/negative/runtime_check_result_unchecked.cpp
    - tests/fixtures/negative/runtime_check_argument_unchecked.cpp
    - tests/fixtures/negative/runtime_check_member_unchecked.cpp
    - tests/fixtures/negative/runtime_check_element_unchecked.cpp
    - tests/fixtures/negative/runtime_check_after_crossing.cpp
    - tests/fixtures/negative/runtime_check_too_weak.cpp
    - tests/fixtures/negative/runtime_check_other_value.cpp
    - tests/fixtures/negative/runtime_check_stale_after_write.cpp
    - tests/fixtures/negative/runtime_check_stale_after_call.cpp
    - tests/fixtures/negative/runtime_check_stale_after_unsafe.cpp
    - tests/fixtures/negative/runtime_check_or_route.cpp
    - tests/fixtures/negative/runtime_check_and_false_route.cpp
    - tests/fixtures/negative/runtime_check_loop_exit.cpp
  unit:
    - tests/unit/trust_closure_test.cpp
    - tests/unit/interface_test.cpp
  end_to_end:
    - tests/e2e/runtime_validation.sh

required_test_categories:
  - every crossing form established by a check, and the program run on valid and invalid input
  - the failure path constructs nothing, in every crossing form
  - a check made too late, too weak, of another value, or made stale
  - short-circuit routes and loop exits
  - a crossing a check selects but does not need is not a site
  - a crossing a precondition establishes is not a site
  - sites listed whole; claims resting on them, directly and through calls
  - a site is never shown PROVEN and never counted as an assumption
  - erasure keeps every check; identical code against the hand erasure
  - sites cross units in their own interface category and result identity

completion_requires:
  - no crossing is reported established statically without kernel-accepted evidence
  - no obligation is added, removed or weakened by the classification
  - every claim resting on a site names it, across units too
  - a site adds no trusted assumption
  - the check survives erasure unchanged
