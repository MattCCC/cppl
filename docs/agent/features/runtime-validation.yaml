# Machine-readable manifest for the runtime-validation feature.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature runtime-validation

feature: runtime-validation

summary: >
  An unknown runtime value comes to satisfy a refinement in one of two ways,
  kept apart. An ordinary C++ condition selects a path, and a crossing on it is
  proven from the path's facts: static proof, PROVEN, with no site and no
  runtime code of C++L's. A validation expression, validate<R>(e), asks the
  program to test the value against R's predicate: it lowers to a validator the
  refinement's declaration lowers to beside its alias, erasure keeps it, and
  what its success establishes is RUNTIME-CHECKED at that site. Every crossing
  owes its predicate under its whole path, validations passed included, and one
  the kernel does not accept is refused, never made a site. Every claim resting
  on a site, in its own body, through verified calls or through an imported
  contract, names it and stays PROVEN; a site is not a trusted assumption. A
  verification interface records sites as a category of their own, part of the
  record's result identity.

normative_sources:
  spec:
    - "§28 Runtime validation"
    - "§28.5 Runtime validation sites"
    - "§36.5 Runtime validation is not erased"
    - "§57 Verification and runtime checking are orthogonal"
    - "Annex V.15 runtime validation + refinement"
    - "Annex V.16 runtime validation + trusted"
    - "Annex Z.78 runtime validation failure"
  trust:
