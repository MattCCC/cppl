# Machine-readable manifest for the machine-arithmetic feature.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature machine-arithmetic

feature: machine-arithmetic

summary: >
  C++ integer arithmetic with its exact semantics. Unsigned `+ - *` are the
  ring of integers modulo 2^width. Signed `+ - *` and unary `-`, `/` and `%`,
  and a conversion to a signed type that may not fit are defined only under a
  condition, which every evaluation on a verified path owes as an obligation:
  the exact result is representable, the divisor is not zero, the operands are
  not the least value and -1, the converted value fits. Where the condition
  holds the total core primitive is the C++ value. Promotions and the usual
  arithmetic conversions are the ones Clang recorded. A specification's C++
  condition holds only where its operations are defined. Nothing is added to
  the runtime program.

normative_sources:
  spec:
    - "§7.1.1 Machine-integer arithmetic"
    - "§7.5 Arithmetic reasoning over machine integers"
    - "§29 Machine arithmetic"
    - "§31 Undefined behavior"
    - "Annex B.4, B.6, B.7 Unary, increment and arithmetic expressions"
    - "Annex T.1 to T.3 Defined-behavior obligations"
    - "Annex U.5 Admissible arithmetic"
  foundations:
    - "33 Machine integer domains"
    - "35 Machine arithmetic normalization"
    - "36 Arithmetic proof rules"
  trust:
    - "§5.2 Primitive formal semantics"
    - "§17 Arithmetic, conversions and undefined behavior"
  rfcs:
    - "0006 Machine arithmetic"
    - "0019 Signed arithmetic, division and integer conversions"

rule_families:
  - ARITH

# The rules this feature realizes, within those families and outside them.
# `cppl-spec-rules extract --feature` reads only the families above; extract
# the others by ID.
