  - contracts, preconditions and postconditions
  - refinement types
  - loops, invariants and measures
  - calls, and which of their postconditions an operation may suppose
  - templates, verified per specialization
  - compound assignment and increment
  - pure functions, which refuse such operations
  - laws and proofs, whose claimed arguments refuse them
  - erasure

