required_test_categories:
  - the boundary of every width, rejected, with its twin one step inside accepted
  - large products, rejected, and products of promoted narrow values accepted
  - division and remainder by zero, signed and unsigned
  - the least value over -1, for `/` and `%`
  - negation of the least value
  - truncation toward zero and the remainder's sign, in every sign combination
  - conversions that do not fit a signed target, implicit and cast
  - mixed signedness through the usual arithmetic conversions
  - arithmetic proven by a guard, a precondition, a refinement, an invariant, a callee
  - either arm of `?:` and the right of `&&` and `||`, each owing only on its route
  - a call not sequenced before an operation lends it nothing
  - specifications that are defined only where their arithmetic is
  - pure functions and law instances that refuse such operations
  - the kernel's folding and constraints against an independent evaluator
  - the verifier's decision and value against the host, from a logged seed
  - erasure: the runtime program and its erasure compute the stated values

completion_requires:
  - every signed operation, division and narrowing conversion owes its condition on its path
  - no signed overflow is modeled as wrapping
  - promotions and conversions are read from Clang, never derived
  - a specification never takes its meaning from undefined behavior
  - nothing is added to the runtime program
