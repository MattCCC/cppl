implementation:
  frontend:
    - compiler/frontend/include/cppl/frontend/syntax.hpp
    - compiler/frontend/src/recognizer.cpp
    - compiler/frontend/src/projection.cpp
  clang:
    - clang/include/cppl/clang/ast.hpp
    - clang/src/bridge.cpp
  elaboration:
    - compiler/elaboration/src/elaborate.cpp

interactions:
  - reference parameters that may designate the object or a member of it
  - member calls on the object, on locals, parameters and their members
  - free functions calling member functions and member functions calling free functions
  - const, mutable and ref-qualified member functions and their overloads
  - rvalue receivers named by std::move, std::forward and static_cast<T&&>
  - receivers a pointer parameter designates, under its capability
  - refined members, charged where each value enters and not again at a return
  - recursion groups through member functions
  - unsafe blocks writing the object
  - by-reference aggregate parameters read after a write that may reach them
  - reference members, bit-fields, anonymous unions and structs, volatile members, which have no place
  - static pure member functions used in contracts
  - virtual dispatch, which is refused
  - member functions defined in another translation unit, through its verification interface
  - erasure and layout

