# Machine-readable manifest for the verified-methods feature.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature verified-methods

feature: verified-methods

summary: >
  A non-static member function that C++ binds statically is a verified callable
  whose implicit object is storage: each scalar place of the object is a
  reference parameter standing before the written ones, bound as the function's
  qualifiers say. The body reads and writes members through the one read and
  write path, a write owes the member's refinement and invalidates what may
  alias it, and a call on an object passes the object's places and gives them
  the post-call versions the callee's contract describes. The object may alias
  any reference argument. Virtual functions and calls, constructors,
  destructors, member templates, members of class templates, unions and classes
  with bases are refused where written. The class erases to itself.

normative_sources:
  spec:
    - "§11.9 Member functions and the implicit object"
    - "§11.11 Virtual functions and overriding contracts"
    - "Annex F.5.1 Verified member functions"
    - "Annex F.10 Virtual functions"
  grammar:
    - "§8 Verified functions"
  foundations:
    - "§7.2 Storage/capability context"
  trust:
    - "§21 Objects, classes, construction and destruction"
    - "§21.1 Virtual dispatch"
  architecture:
    - "§43 (ARCH-OBJ-002)"
  rfc:
    - "docs/rfcs/0018-verified-member-functions.md"

rule_families:
  - CLASS

# The rules this feature realizes, within that family and outside it.
# `cppl-spec-rules extract --feature` reads only the families above; extract
# the others by ID.
