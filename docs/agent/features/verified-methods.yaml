required_test_categories:
  - const member function
  - mutating member function
  - refined member write, matched pair
  - member postcondition
  - member function calling member function
  - member and free function composition, both directions
  - overloads on const and on ref-qualifier
  - cv-qualified and ref-qualified implicit objects
  - an object aliased by a reference argument
  - decreases, and a non-decreasing twin refused
  - refined return
  - a stale member fact refused
  - virtual function and virtual call refused
  - a member function defined in another translation unit, used and refused through its interface
  - an rvalue receiver named by std::move, and a copy refused
  - a receiver through a pointer, with and without its capability
  - each route into a refined member charged, and a return charged only for an uncharged version
  - a place the callee cannot write kept, and one it may write through an alias taken away
  - members whose storage may overlap refused, and scalar members kept apart
  - volatile member functions refused
  - static pure member functions in contracts
  - erasure to ordinary C++ with unchanged layout and symbols

completion_requires:
  - every place a verified body can reach through the object is a tracked place of it
  - no disjointness is assumed between the object and any reference argument beyond the common alias model
  - a call leaves only what the callee's postcondition states of every place it may write
  - every version of a refined place is charged where it is established, or charged at the return
  - virtual dispatch is refused until override substitutability is checked
  - the class erases member for member, with no verification-only parameter
