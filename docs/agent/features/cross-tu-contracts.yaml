# Machine-readable manifest for contracts across translation units.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature cross-tu-contracts

feature: cross-tu-contracts

summary: >
  A unit that verifies may record, in a verification interface, each contract it
  proved for a function with external linkage: its USR, a canonical identity of
  what the contract states, whether it is total, and, each category apart, the
  trusted laws, library models, unsafe blocks, runtime validation sites and
  contracts of other units its proof rests on. A unit that declares the function
  without defining it relies on the contract only when it imports an interface
  recording that same function and that same statement, rebuilt from its own
  declaration; an interface that is malformed, of another format version,
  compiler release, semantics or configuration, naming a model this compiler
  does not have, or stale is refused whole, conflicting records and records
  whose dependencies are not imported as proven are refused, and a cycle of
  verified contracts crossing a unit is refused. A claim resting on an imported
  contract carries it as an external verified dependency, with everything its
  record rests on, and is never assumption-free: the record is believed on the
  provenance of an interface nothing authenticates, which the report states.
  The closure crosses complete. No evidence crosses: the interface is artifact
  and reuse TCB. The interface reaches no object.

