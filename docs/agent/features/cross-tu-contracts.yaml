    - compiler/artifact/src/interface.cpp
  clang:
    - clang/include/cppl/clang/ast.hpp
    - clang/src/bridge.cpp
  elaboration:
    - compiler/elaboration/src/elaborate.cpp
  vir:
    - vir/include/cppl/vir/module.hpp
  obligations:
    - compiler/obligations/include/cppl/obligations/interface.hpp
    - compiler/obligations/src/interface.cpp
    - compiler/obligations/include/cppl/obligations/contracts.hpp
    - compiler/obligations/src/contracts.cpp
    - compiler/obligations/include/cppl/obligations/trust.hpp
    - compiler/obligations/src/trust.cpp
  automation:
    - compiler/automation/src/composition.cpp
  driver:
    - compiler/driver/include/cppl/driver/options.hpp
    - compiler/driver/src/options.cpp
    - compiler/driver/src/interface_io.hpp
    - compiler/driver/src/interface_io.cpp
    - compiler/driver/src/pipeline.hpp
    - compiler/driver/src/pipeline.cpp
    - compiler/driver/src/driver.cpp

interactions:
  - refined parameters and results
  - reference parameters and their post-state
  - memory capabilities owed at calls
  - measures and totality
  - trusted laws and unsafe blocks of the other unit
  - overloads and explicit template specializations
  - chains of units
  - repeated verified declarations in one unit
  - erasure and native ABI

tests:
  positive:
    - tests/fixtures/cross_tu/library.hpp
    - tests/fixtures/cross_tu/library.cpp
    - tests/fixtures/cross_tu/middle.hpp
    - tests/fixtures/cross_tu/middle.cpp
    - tests/fixtures/cross_tu/client.cpp
    - tests/fixtures/cross_tu/rival.cpp
  negative:
    - tests/negative/cross_tu.sh
    - tests/fixtures/negative/xtu_false_postcondition.cpp
    - tests/fixtures/negative/xtu_missing_precondition.cpp
    - tests/fixtures/negative/xtu_refined_result_stronger.cpp
    - tests/fixtures/negative/xtu_partial_callee.cpp
    - tests/fixtures/negative/xtu_wrong_overload.cpp
    - tests/fixtures/negative/xtu_unrecorded_overload.cpp
    - tests/fixtures/negative/xtu_other_specialization.cpp
    - tests/fixtures/negative/xtu_stronger_declaration.cpp
    - tests/fixtures/negative/xtu_weaker_precondition.cpp
    - tests/fixtures/negative/xtu_unproven_declaration.cpp
    - tests/fixtures/negative/xtu_template_declaration.cpp
    - tests/fixtures/negative/xtu_internal_linkage.cpp
    - tests/fixtures/negative/xtu_conflicting_redeclaration.cpp
    - tests/fixtures/negative/xtu_middle_only.cpp
    - tests/fixtures/negative/xtu_library_changed.cpp
    - tests/fixtures/negative/xtu_truncated.cppli
    - tests/fixtures/negative/xtu_checksum_mismatch.cppli
    - tests/fixtures/negative/xtu_status_refused.cppli
    - tests/fixtures/negative/xtu_other_version.cppli
    - tests/fixtures/negative/xtu_other_build.cppli
  unit:
    - tests/unit/interface_test.cpp
    - tests/unit/cross_unit_contracts_test.cpp
  fuzz:
    - tests/fuzz/interface.cpp
  end_to_end:
    - tests/e2e/cross_tu.sh

required_test_categories:
  - recording, determinism, internal linkage not recorded
  - precondition, postcondition, refined result, reference post-state
  - overload and specialization identity
  - declaration without a record refused
  - stronger and weaker declared contracts refused
  - malformed, truncated, altered, other version, other build, other mode, stale
  - trust closure through the imported contract, a local call and a third unit
  - totality as recorded; a partial record of a measured function refused
  - recursion across units refused
  - chains need every interface; conflicting records refused
  - repeated verified declarations compared by meaning
  - erasure and ABI against hand erasures, mixed links

completion_requires:
  - no declaration alone establishes a contract
  - a record is used only for the same function and the same statement
  - any doubt about an interface refuses it
  - every claim through a record reports it and what it rests on
  - interfaces change no object and no ABI
