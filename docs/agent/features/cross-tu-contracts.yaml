required_test_categories:
  - recording, determinism, internal linkage not recorded
  - precondition, postcondition, refined result, reference post-state
  - overload and specialization identity
  - transitive pure-definition identity; a measure crossing only as the request to terminate
  - a record identified by meaning: rewording keeps dependents, another result breaks them
  - declaration without a record refused
  - stronger and weaker declared contracts refused
  - malformed, truncated, altered, an earlier or later format version, another compiler release, other semantics version, other verifier semantics digest, other mode, stale
  - a library model this compiler does not have refused
  - another build of the same release, touched sources and a moved interface still used
  - the verifier semantics digest follows every semantic source and nothing else, and every source is classified
  - trust closure through the imported contract, a local call and a third unit
  - no claim through a record assumption-free, a forged record included, with the records listed and interface provenance stated as unauthenticated; matched twins through a trusted law, a model and an unsafe block, direct and relayed
  - closure completeness, each category withheld from the export, the carrying and the import
  - totality as recorded; a partial record of a measured function refused
  - recursion across units refused
  - chains need every interface; conflicting records refused
  - repeated verified declarations compared by meaning
  - erasure and ABI against hand erasures, mixed links

completion_requires:
  - no declaration alone establishes a contract
  - a record is used only for the same function and the same statement
  - any doubt about an interface refuses it
  - every claim through a record reports it and what it rests on
  - a claim through a record is never assumption-free, and its complete inherited closure is reported, each category apart
  - interfaces change no object and no ABI
