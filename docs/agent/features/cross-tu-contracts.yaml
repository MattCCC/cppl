# Machine-readable manifest for contracts across translation units.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature cross-tu-contracts

feature: cross-tu-contracts

summary: >
  A unit that verifies may record, in a verification interface, each contract it
  proved for a function with external linkage: its USR, a canonical identity of
  what the contract states, whether it is total, and the trusted laws, unsafe
  blocks and contracts of other units its proof rests on. A unit that declares
  the function without defining it relies on the contract only when it imports
  an interface recording that same function and that same statement, rebuilt
  from its own declaration; an interface that is malformed, of another version
  or configuration, or stale is refused whole, conflicting records and records
  whose dependencies are not imported as proven are refused, and recursion
  across units is refused. A claim resting on an imported contract carries it
  and what it rests on, and is never assumption-free. No evidence crosses: the
  interface is artifact and reuse TCB. The interface reaches no object.

normative_sources:
  spec:
    - "Annex L.1 Public contracts"
    - "Annex L.2 Verification metadata across translation units"
    - "Annex L.2.1 Verification interfaces"
    - "§44 Declarations, headers and translation units"
  foundations:
    - "§114 Cross-translation-unit proof composition"
  trust:
    - "§31 Translation units, modules and verification metadata"
    - "§31.1 Verification interfaces as implemented"
  rfc:
    - "docs/rfcs/0017-cross-translation-unit-verification.md"

rule_families:
  - TUBOUND

rules:
  - TUBOUND-001
  - TUBOUND-002
  - TUBOUND-003
  - TUBOUND-004
  - TUBOUND-005
  - TUBOUND-006
  - TUBOUND-007
  - TUBOUND-008
  - TUBOUND-009
  - TU-002
  - TU-003
  - TU-004
  - TEMPLATE-003

depends_on:
