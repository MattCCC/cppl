required_test_categories:
  - array, vector, string and span subscripts proved in bounds, and refused unguarded
  - a bound proved before a shrinking mutator bounds nothing after it
  - every modeled mutator's length, and pop_back's precondition
  - an element reference and a span used after reallocation, clear, a move, a mutable-reference call, a loop and an unsafe block
  - a span formed only over a container that outlives it, never returned or passed by reference
  - a span parameter read or written without its capability, and a capability forwarded
  - a call handed a view of a container it may also reallocate
  - data() only over a capability of at most the length
  - refined elements owed at every entry and supplied at every read
  - a moved-from container has no facts
  - two references naming one vector, and a reference naming its element
  - unmodeled members, element types, allocators and vector<bool> refused by name
  - claims resting on a model, directly and through a verified call, never assumption-free
  - erasure equivalence at -O0 and -O2, C++20 and C++23, and runtime behavior
  - the same claims against libc++ and libstdc++

completion_requires:
  - no element is read or written without its bound proved
  - no view or element reference is used after its storage may have changed
  - a span parameter's validity is never assumed from its existence
  - every library summary is listed in TRUST.md and its use reported
  - no claim resting on a model is reported assumption-free
  - the subset adds no kernel rule and no axiom
  - the program erases to its own code
