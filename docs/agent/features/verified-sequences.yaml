# Machine-readable manifest for the verified-sequences feature.
#
# Rule IDs are anchors in docs/SPEC.md, the canonical specification. Extract the
# normative text with:
#
#     cppl-spec-rules extract --feature verified-sequences

feature: verified-sequences

summary: >
  Verified code uses `std::array`, `std::vector`, `std::string` and
  dynamic-extent `std::span` through a stated subset (RFC 0020). A `vector`,
  `string` or `span` is a length and element places at a storage generation; an
  array is its element places. Every subscript owes its bound. Construction and
  the modeled mutators are trusted library summaries over the length, supposed
  at the call as a callee's postcondition is, and `pop_back` owes a non-empty
  vector. Every operation that may reallocate, shrink, replace or move a
  container's storage gives it a new generation, and a view or element
  reference used after it is refused. A span parameter holds nothing by
  existing: `readable(s)` or `writable(s)` is stated and owed. A refined element
  type is owed at every entry. Every claim resting on a model is reported so and
  never assumption-free. The subset erases to the program's own code.

normative_sources:
  spec:
    - "Annex J.1 std::array, J.2 std::span, J.7 std::vector, J.8 std::basic_string"
    - "Annex J.17 The verified sequence subset"
    - "§20.4 Product decomposition (std::array)"
    - "§32 Memory and lifetime, Annex E storage"
  trust:
    - "§28.1 The verified sequence models"
  architecture:
    - "§66.1 The verified sequence models"
  compatibility:
    - "§50.1 The verified sequence models"
  rfc:
    - "docs/rfcs/0020-verified-containers-and-lifetime.md"

rule_families:
  - STDMODEL

# The rules this feature realizes, within that family and outside it.
# `cppl-spec-rules extract --feature` reads only the families above; extract
# the others by ID.
