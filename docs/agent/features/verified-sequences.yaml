interactions:
  - refinement types as element types
  - memory capabilities on span parameters and data pointers
  - verified-call composition and call-site disjointness
  - loop invariants over a container a loop mutates
  - unsafe blocks and calls that take a container by mutable reference
  - aliasing between reference parameters and element references
  - moves
  - trust propagation through verified calls
  - erasure

