name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Nightly checks, including ThreadSanitizer.
    - cron: "23 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install LLVM/Clang 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y \
            llvm-22-dev \
            libclang-22-dev \
            clang-format-22 \
            clang-tidy-22 \
            clang-tools-22

      - name: Configure
        run: |
          cmake --preset dev \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-22/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++ \
            -DLibClang_ROOT=/usr/lib/llvm-22

      - name: Check formatting
        run: cmake --build build/dev --target format-check

      - name: Static analysis
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          /usr/lib/llvm-22/bin/run-clang-tidy -p build/dev -j 2

  build-test:
    name: Build & test / ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            platform: linux-gcc

          - name: Linux Clang 22
            os: ubuntu-latest
            platform: linux-clang

          - name: macOS Clang 22
            os: macos-latest
            platform: macos

          - name: Windows Clang-CL 22
            os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install LLVM/Clang 22 / Linux
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y \
            llvm-22-dev \
            libclang-22-dev \
            clang-format-22 \
            clang-tidy-22

      - name: Install LLVM/Clang 22 / macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_ROOT=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Install LLVM/Clang 22 / Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade llvm `
            --version=22.1.7 `
            --allow-downgrade `
            --no-progress `
            --yes
          "LLVM_ROOT=C:/Program Files/LLVM" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Linux GCC
        if: matrix.platform == 'linux-gcc'
        run: |
          CXXFLAGS="-Wno-pedantic" \
          cmake --preset dev \
            -DCMAKE_C_COMPILER=/usr/bin/gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
            -DCPPL_WARNINGS_AS_ERRORS=OFF \
            -DLibClang_ROOT=/usr/lib/llvm-22

      - name: Configure Linux Clang 22
        if: matrix.platform == 'linux-clang'
        run: |
          cmake --preset dev \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-22/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++ \
            -DLibClang_ROOT=/usr/lib/llvm-22

      - name: Configure macOS Clang 22
        if: matrix.platform == 'macos'
        run: |
          cmake --preset dev \
            -DCMAKE_C_COMPILER="${LLVM_ROOT}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_ROOT}/bin/clang++" \
            -DLibClang_ROOT="${LLVM_ROOT}"

      - name: Configure Windows Clang-CL 22
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake --preset dev `
            -G Ninja `
            "-DCMAKE_C_COMPILER=$env:LLVM_ROOT/bin/clang-cl.exe" `
            "-DCMAKE_CXX_COMPILER=$env:LLVM_ROOT/bin/clang-cl.exe" `
            "-DLibClang_ROOT=$env:LLVM_ROOT"

      - name: Build
        run: cmake --build build/dev --parallel

      - name: Test
        run: >
          ctest
          --test-dir build/dev
          --output-on-failure
          --no-tests=error

  sanitizers:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            preset: asan

          - name: UndefinedBehaviorSanitizer
            preset: ubsan

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install LLVM/Clang 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y \
            llvm-22-dev \
            libclang-22-dev \
            clang-format-22 \
            clang-tidy-22

      - name: Configure
        run: |
          cmake --preset "${{ matrix.preset }}" \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-22/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++ \
            -DLibClang_ROOT=/usr/lib/llvm-22

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Test
        run: >
          ctest
          --test-dir build/${{ matrix.preset }}
          --output-on-failure
          --no-tests=error

  thread-sanitizer:
    name: ThreadSanitizer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install LLVM/Clang 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y \
            llvm-22-dev \
            libclang-22-dev \
            clang-format-22 \
            clang-tidy-22

      - name: Configure
        run: |
          cmake --preset tsan \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-22/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++ \
            -DLibClang_ROOT=/usr/lib/llvm-22

      - name: Build
        run: cmake --build build/tsan --parallel

      - name: Test
        run: >
          ctest
          --test-dir build/tsan
          --output-on-failure
          --no-tests=error

  required:
    name: Required CI
    if: always()

    needs:
      - quality
      - build-test
      - sanitizers

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]]; then
              echo "Quality checks failed."
              exit 1
          fi

          if [[ "${{ needs.build-test.result }}" != "success" ]]; then
              echo "Build/test matrix failed."
              exit 1
          fi

          if [[ "${{ needs.sanitizers.result }}" != "success" ]]; then
              echo "Sanitizer checks failed."
              exit 1
          fi

          echo "All required CI checks passed."
