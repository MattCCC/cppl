name: CI

# This workflow provisions runners and selects compilers. It does not decide
# how C++L is built.
#
# Build type, warning policy, sanitizer selection, binary directories and test
# configuration all live in CMakePresets.json, so that every job below runs the
# same configuration a developer runs locally:
#
#   cmake --preset <preset>
#   cmake --build --preset <preset>
#   ctest --preset <preset>
#
# Adding a -D flag here instead of to a preset reintroduces the drift this
# structure exists to prevent. See docs/DEVELOPER_GUIDE.md.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Nightly checks, including ThreadSanitizer.
    - cron: "23 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  CPPL_LLVM_MAJOR: "22"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CPPL_CI_PRESET: ci-quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install LLVM/Clang
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${CPPL_LLVM_MAJOR}"
          sudo apt-get install -y \
            "llvm-${CPPL_LLVM_MAJOR}-dev" \
            "libclang-${CPPL_LLVM_MAJOR}-dev" \
            "clang-format-${CPPL_LLVM_MAJOR}" \
            "clang-tidy-${CPPL_LLVM_MAJOR}" \
            "clang-tools-${CPPL_LLVM_MAJOR}"
          echo "LLVM_ROOT=/usr/lib/llvm-${CPPL_LLVM_MAJOR}" >> "$GITHUB_ENV"

      - name: Repository checks
        run: |
          cmake -P cmake/ci/CheckHostPaths.cmake
          cmake -P cmake/ci/CheckPresetLayout.cmake

      - name: Configure
        run: cmake --preset ci-quality

      - name: Check formatting
        run: cmake --build --preset ci-quality --target format-check

      - name: Static analysis
        run: cmake --build --preset ci-quality --target lint

  build-test:
    name: Build & test / ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            preset: ci-linux-gcc

          - name: Linux Clang
            os: ubuntu-latest
            preset: ci-linux-clang

          - name: macOS LLVM
            os: macos-latest
            preset: ci-macos-llvm

          - name: Windows Clang-CL
            os: windows-latest
            preset: ci-windows-clang-cl

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      CPPL_CI_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install LLVM/Clang / Linux
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${CPPL_LLVM_MAJOR}"
          sudo apt-get install -y \
            "llvm-${CPPL_LLVM_MAJOR}-dev" \
            "libclang-${CPPL_LLVM_MAJOR}-dev" \
            "clang-format-${CPPL_LLVM_MAJOR}" \
            "clang-tidy-${CPPL_LLVM_MAJOR}"
          echo "LLVM_ROOT=/usr/lib/llvm-${CPPL_LLVM_MAJOR}" >> "$GITHUB_ENV"

      - name: Install LLVM/Clang and Ninja / macOS
        if: runner.os == 'macOS'
        run: |
          brew install "llvm@${CPPL_LLVM_MAJOR}" ninja
          echo "LLVM_ROOT=$(brew --prefix "llvm@${CPPL_LLVM_MAJOR}")" >> "$GITHUB_ENV"

      - name: Install LLVM/Clang / Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade llvm `
            --version=22.1.7 `
            --allow-downgrade `
            --no-progress `
            --yes
          "LLVM_ROOT=C:/Program Files/LLVM" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            preset: ci-asan

          - name: UndefinedBehaviorSanitizer
            preset: ci-ubsan

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CPPL_CI_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install LLVM/Clang
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${CPPL_LLVM_MAJOR}"
          sudo apt-get install -y \
            "llvm-${CPPL_LLVM_MAJOR}-dev" \
            "libclang-${CPPL_LLVM_MAJOR}-dev" \
            "clang-format-${CPPL_LLVM_MAJOR}" \
            "clang-tidy-${CPPL_LLVM_MAJOR}"
          echo "LLVM_ROOT=/usr/lib/llvm-${CPPL_LLVM_MAJOR}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  thread-sanitizer:
    name: ThreadSanitizer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CPPL_CI_PRESET: ci-tsan

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install LLVM/Clang
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${CPPL_LLVM_MAJOR}"
          sudo apt-get install -y \
            "llvm-${CPPL_LLVM_MAJOR}-dev" \
            "libclang-${CPPL_LLVM_MAJOR}-dev" \
            "clang-format-${CPPL_LLVM_MAJOR}" \
            "clang-tidy-${CPPL_LLVM_MAJOR}"
          echo "LLVM_ROOT=/usr/lib/llvm-${CPPL_LLVM_MAJOR}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ci-tsan

      - name: Build
        run: cmake --build --preset ci-tsan

      - name: Test
        run: ctest --preset ci-tsan

  required:
    name: Required CI
    if: always()

    needs:
      - quality
      - build-test
      - sanitizers

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]]; then
              echo "Quality checks failed."
              exit 1
          fi

          if [[ "${{ needs.build-test.result }}" != "success" ]]; then
              echo "Build/test matrix failed."
              exit 1
          fi

          if [[ "${{ needs.sanitizers.result }}" != "success" ]]; then
              echo "Sanitizer checks failed."
              exit 1
          fi

          echo "All required CI checks passed."
